
name: Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build and smoke-test the image
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t app:ci .

      - name: Inspect image
        run: |
          docker history app:ci
          docker image ls app:ci
          docker image inspect --format '{{.Os}}/{{.Architecture}}' app:ci

      - name: Test application
        run: |
          docker run -d --name app -e PORT=9123 -p 9123:9123 app:ci
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors http://localhost:9123/healthz
          echo
          docker inspect --format '{{.Config.User}}' app:ci

      - name: Show logs on failure
        if: failure()
        run: docker logs app || true
